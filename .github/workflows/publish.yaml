name: Publish Tarantool WIT package

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  WKG_VERSION: 0.16.0

jobs:
  validate:
    uses: ./.github/workflows/ci.yaml
    with:
      exclude-tag: ${{ github.ref_name }}

  publish:
    needs: validate
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify release version
        run: scripts/check-release-version.sh "${{ github.ref_name }}" "${{ github.ref_type }}"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install wkg
        shell: bash
        run: cargo binstall --no-confirm --version "$WKG_VERSION" wkg

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Get version from tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mandesero/tarantool/tarantool
          tags: |
            type=semver,pattern={{version}}

      - name: Docker login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WIT to Wasm
        shell: bash
        run: wkg wit build -d wit -o tarantool-tarantool.wasm

      - name: Publish to GitHub Container Registry
        id: publish
        uses: bytecodealliance/wkg-github-action@v5
        with:
          oci-reference-without-tag: ghcr.io/mandesero/tarantool/tarantool
          file: 'tarantool-tarantool.wasm'
          description: 'WIT definitions for Tarantool (WASM component)'
          source: 'https://github.com/mandesero/tarantool-wit'
          homepage: 'https://github.com/mandesero/tarantool-wit'
          version: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          licenses: 'BSD-2-Clause'

      - name: Sign the Wasm component
        run: |
          cosign sign --yes ghcr.io/mandesero/tarantool/tarantool@${{ steps.publish.outputs.digest }}
